  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; width: 100%; overflow: hidden; }
    body { 
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #fff;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
    }
    #root { 
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      display: flex;
      background: #fff;
      overflow: hidden;
    }
    #root > div { flex: 1; overflow: hidden; }
    @media (max-width: 500px) {
      #root > div { width: 100% !important; height: 100% !important; border-radius: 0 !important; box-shadow: none !important; }
    }
  </style>

<body>
  <div id="root"></div>
  <script>
    // Bloquear gestor de contraseñas y sugerencias del teclado en todos los inputs
    document.addEventListener('DOMContentLoaded', blockPassManager);
    const _obs = new MutationObserver(blockPassManager);
    _obs.observe(document.body || document.documentElement, { childList: true, subtree: true });
    function blockPassManager() {
      document.querySelectorAll('input').forEach(function(el) {
        el.setAttribute('autocomplete', 'new-password');
        el.setAttribute('autocorrect', 'off');
        el.setAttribute('autocapitalize', 'off');
        el.setAttribute('spellcheck', 'false');
        el.setAttribute('data-form-type', 'other');
        el.setAttribute('data-lpignore', 'true');
        el.setAttribute('data-1p-ignore', 'true');
        if (el.type === 'password') el.type = 'text';
      });
      document.querySelectorAll('form').forEach(function(el) {
        el.setAttribute('autocomplete', 'off');
      });
    }

    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(r => console.log('SW registrado', r.scope))
        .catch(e => console.log('SW error', e));
    }

    // Ocultar barra de notificaciones y navegacion (fullscreen API)
    function goFullscreen() {
      const el = document.documentElement;
      if (document.fullscreenElement) return;
      if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
    }
    document.addEventListener('click', goFullscreen);
    document.addEventListener('touchstart', goFullscreen);
    window.addEventListener('load', goFullscreen);
    document.addEventListener('fullscreenchange', function() {
      if (!document.fullscreenElement) setTimeout(goFullscreen, 500);
    });
  </script>
